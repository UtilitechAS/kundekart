<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amsleser.no – kundekart</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
<div id="map"></div>
<script>
// Bytt kartleverandør her ved behov
const TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsytere';

const map = L.map("map").setView([60, 14], 4);
L.tileLayer(TILES, { maxZoom: 14, attribution: ATTR }).addTo(map);

const SIZE = 24;  // markørstørrelse i piksler
const icon = L.icon({ iconUrl: "logo.png", iconSize: [SIZE, SIZE], iconAnchor: [SIZE / 2, SIZE * 0.88] });

fetch("kunder.geojson", { cache: "no-cache" })
  .then(r => r.json())
  .then(d => L.geoJSON(d, { pointToLayer: (f, ll) => L.marker(ll, { icon, interactive: false }) }).addTo(map));
</script>
</body>
</html>
